<body>
<header><b>2 Guys Scoreboard</b><a href="https://daegansmith.me/2guys-site/scoreboard.html">What's being tested</a><a id="all" href="?all=1">Show test visits</a><a id="out" href="#" hidden>Forget password</a></header>
<form id="f" hidden>
<h1>What's Winning</h1>
<p>Enter the scoreboard password once. This browser remembers it after that.</p>
<input id="k" type="password" autocomplete="current-password" placeholder="Scoreboard password">
<button type="submit">Show the scoreboard</button>
<p id="bad" hidden>That password didn't work. Try again.</p>
</form>
<iframe id="b" title="Scoreboard" hidden></iframe>
<script>
(function(){
  var W='https://2g-stats.daegansmith.workers.dev', S='2g-board-key';
  var all=new URLSearchParams(location.search).get('all')==='1';
  var a=document.getElementById('all'); if(all){a.textContent='Hide test visits';a.href='./';}
  function get(){try{return localStorage.getItem(S)}catch(e){return null}}
  function put(v){try{v?localStorage.setItem(S,v):localStorage.removeItem(S)}catch(e){}}
  function ask(bad){document.getElementById('f').hidden=false;document.getElementById('b').hidden=true;document.getElementById('bad').hidden=!bad;document.getElementById('out').hidden=true;}
  function show(key){
    fetch(W+'/data?key='+encodeURIComponent(key),{cache:'no-store'}).then(function(r){
      if(!r.ok){put(null);return ask(true);}
      put(key);
      var b=document.getElementById('b');b.src=W+'/board?key='+encodeURIComponent(key)+(all?'&all=1':'');b.hidden=false;
      document.getElementById('f').hidden=true;document.getElementById('out').hidden=false;
    }).catch(function(){ask(true)});
  }
  document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();show(document.getElementById('k').value.trim());});
  document.getElementById('out').addEventListener('click',function(e){e.preventDefault();put(null);ask(false);});
  var k=get(); if(k) show(k); else ask(false);
})();
</script>
