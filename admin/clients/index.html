<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>Clients · 2 Guys and a Genie</title>
<link rel="icon" type="image/svg+xml" href="/assets/2guys-app-icon.svg">
<link rel="stylesheet" href="/assets/simple.css">
<link rel="stylesheet" href="/assets/client-page.css">
<style>
p,li,.d,.cd{text-wrap:pretty}
.brand .mk{width:28px;height:28px;background:#111;color:#fff;font-weight:900;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.ctrl label.f{display:block;font-size:13px;font-weight:bold;margin:10px 0 4px}
.ctrl input[type=text],.ctrl input[type=email],.ctrl select,.ctrl textarea{width:100%}
.ctrl input,.ctrl select,.ctrl textarea{font-size:16px}
.it{border-bottom:1px solid var(--rule);padding:10px 0}
.it:last-child{border-bottom:0}
.it .hd{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center}
.it .more2{margin-top:8px;padding:10px;background:#F4F2EE}
.bar{position:sticky;bottom:0;background:#fff;border-top:2px solid #111;padding:10px 0;margin-top:20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg{font-size:15px;color:var(--soft)}
.msg.bad{color:#B00020}
.wait{font-weight:bold;background:#FFF3C4;padding:0 4px}
.hint{font-size:13px;color:var(--soft);margin:4px 0 0}
</style>
</head><body>
<header class="site"><div class="hwrap">
<a class="brand" href="/admin/"><span class="mk">2G</span>2 Guys and a Genie</a>
<nav class="top"><a href="/admin/">Admin</a><a href="#" onclick="go('');return false">Clients</a></nav>
</div></header>
<main id="main">
<div id="v"><p class="small">Loading…</p></div>
<footer><p style="font-size:12px;margin:10px 0 0"><a href="/admin/" style="color:#888">Admin</a></p></footer>
</main>
<script src="/assets/client-page.js"></script>
<script>
{
const API = '/admin/api/clients', V = document.getElementById('v'), E = clientEsc;
const STAT = ['Not started', 'Scheduled', 'Working on', 'Done'];
const STAGES = ['Free 15 Minutes', 'What We Found', 'The Master Plan', 'Better Every Month'];
let D = null, cur = '', tab = 'edit', dirty = false, me = '';
const $ = id => document.getElementById(id);
const C = () => D.clients.find(c => c.slug === cur);
const lines = t => String(t || '').split('\n').map(s => s.trim()).filter(Boolean);
const pipes = t => lines(t).map(l => l.split('|').map(s => s.trim()));
function say(t, bad) { const m = $('msg'); if (m) { m.textContent = t; m.className = 'msg' + (bad ? ' bad' : ''); } }
async function load() {
  const r = await fetch(API, { credentials: 'same-origin', cache: 'no-store' });
  if (r.status === 401) { V.innerHTML = '<p>Sign in to Admin first, then come back to this page.</p>'; return; }
  D = await r.json(); me = D.me; draw();
}
async function post(b) {
  say('Saving…');
  const r = await fetch(API, { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b) });
  const j = await r.json().catch(() => ({}));
  if (j.clients) D = j;
  if (!r.ok) { dirty = false; draw(); say(j.error || 'Not saved. Try again.', true); return false; }
  dirty = false; draw(); say('Saved. His page shows it now.'); return j;
}
function save() { const c = C(); c.data.upd = Date.now(); return post({ op: 'save', slug: c.slug, name: c.name, emails: c.emails, data: c.data, upd: c.upd }); }
window.go = s => { if (dirty && !confirm('You have changes that are not saved. Leave without saving?')) return; dirty = false; cur = s; tab = 'edit'; draw(); scrollTo(0, 0); };
window.tabTo = t => { tab = t; draw(); };
const waiting = c => (c.data.qa || []).filter(q => !q.a).length;
const stageName = d => ((d.roadL && d.roadL.length) ? d.roadL : STAGES)[+d.stage || 0] || '';

function list() {
  const cs = D.clients, q = cs.reduce((n, c) => n + waiting(c), 0);
  let h = '<p class="kicker">Admin · Team only</p><h1>Clients.</h1><p>Every owner we\'re working with, where he stands, and what\'s next. Tap one to update his page or see it the way he sees it.</p>';
  h += '<div class="sum"><div><b>' + cs.length + '</b><span>owners with a page</span></div><div><b>' + cs.filter(c => c.emails).length + '</b><span>can sign in to their page</span></div><div><b>' + q + '</b><span>questions waiting on us</span></div><div><b>' + cs.reduce((n, c) => n + (c.data.inbox || []).length, 0) + '</b><span>updates waiting for our OK</span></div></div>';
  h += '<div class="clist">' + cs.map(c => { const d = c.data, t = d.team || {}; return '<button class="crow" onclick="go(\'' + E(c.slug) + '\')"><div class="nm">' + E(c.name) + '</div><div class="meta"><span>Stage: <b>' + E(stageName(d)) + '</b></span><span>Paid so far: <b>' + E(t.paid || '—') + '</b></span><span>On the table: <b>' + E(t.ontable || '—') + '</b></span><span>On it: <b>' + E(t.on || '—') + '</b></span></div><div class="meta"><span>Next: <b>' + E((d.next || {}).h || '—') + '</b></span>' + (waiting(c) ? '<span class="wait">' + waiting(c) + ' question' + (waiting(c) > 1 ? 's' : '') + ' waiting</span>' : '') + (c.emails ? '' : '<span>He can\'t sign in yet (no email added)</span>') + '</div></button>'; }).join('') + '</div>';
  h += '<section class="s"><h2>Add A Client.</h2><div class="ctrl"><label class="f" for="nn">Business or owner name</label><input type="text" id="nn" placeholder="Example: Riverside Heating and Air"><p style="margin:10px 0 0"><button class="mini" onclick="addC()">Add The Client</button> <span id="msg" class="msg"></span></p></div></section>';
  h += '<section class="s"><h2>How A Page Stays True.</h2><ul><li><b>After a call:</b> the summary goes under Waiting For Our OK. One of us taps Post before he sees it.</li><li><b>When we finish something:</b> whoever finished it marks it Done, with what it does, how to use it and the hours it gives back.</li><li><b>When he asks something:</b> it shows here as waiting until one of us answers it on his page.</li></ul><p class="small">Owners sign in at <b>2guysandagenie.com/c/</b> with a code sent to the email you add on his page. Each one sees only his own page. Records live in the private database, never in the site\'s files.</p></section>';
  return h;
}
window.addC = async () => { const n = $('nn').value.trim(); if (!n) { say('Type a name first.', true); return; } const j = await post({ op: 'add', name: n }); if (j && j.made) go(j.made); };

function editor(c) {
  const d = c.data, t = d.team = d.team || {};
  ['items', 'need', 'qa', 'meets', 'more', 'notes', 'inbox', 'stats'].forEach(k => d[k] = d[k] || []);
  d.next = d.next || {}; d.offer = d.offer || {}; d.agree = d.agree || {}; d.plan = d.plan || { q: [], b: [], s: [], n: [] }; d.video = d.video || {};
  let h = '';
  // 1. Waiting for our OK
  h += '<div class="ctrl"><h4>Waiting For Our OK</h4><p class="small" style="margin:0 0 6px">New from calls and notes (Granola, Zoom, Bee, Jimmy\'s Notion). Nothing reaches his page until one of us taps Post. Edit lets you change the words first.</p>' +
    (d.inbox.length ? d.inbox.map((u, i) => '<div class="it"><span class="src">' + E(u.src) + '</span><input type="text" value="' + E(u.t) + '" oninput="C().data.inbox[' + i + '].t=this.value;mark()"><textarea oninput="C().data.inbox[' + i + '].d=this.value;mark()">' + E(u.d) + '</textarea><p style="margin:6px 0 0"><button class="mini" onclick="postIn(' + i + ')">Post</button> <button class="mini ghost" onclick="C().data.inbox.splice(' + i + ',1);save()">Skip</button></p></div>').join('') : '<p class="small" style="margin:0">Nothing waiting.</p>') + '</div>';
  // 2. Questions he asked
  const open = d.qa.map((q, i) => [q, i]).filter(x => !x[0].a);
  h += '<div class="ctrl"><h4>His Questions</h4>' + (open.length ? open.map(([q, i]) => '<div class="it"><p style="margin:0"><b>He asked</b> (' + E(new Date(q.ts || Date.now()).toLocaleDateString()) + '): ' + E(q.q) + '</p><textarea id="ans' + i + '" placeholder="Your answer. It shows on his page under his question."></textarea><button class="mini" onclick="answer(' + i + ')">Answer</button></div>').join('') : '<p class="small" style="margin:0">No questions waiting.</p>') + '</div>';
  // 3. His items
  h += '<div class="ctrl"><h4>His Items</h4><p class="small" style="margin:0 0 6px">Change where each one stands, then Save. Not started stays off his page. Done asks for how to use it and the hours it gives back.</p>' +
    d.items.map((x, i) => '<div class="it"><div class="hd"><input type="text" value="' + E(x.t) + '" oninput="C().data.items[' + i + '].t=this.value;mark()"><select onchange="setSt(' + i + ',this.value)">' + STAT.map(o => '<option' + (o === x.st ? ' selected' : '') + '>' + o + '</option>').join('') + '</select></div><label class="f">What it is (he reads this)</label><textarea oninput="C().data.items[' + i + '].d=this.value;mark()">' + E(x.d) + '</textarea>' +
      (x.st === 'Done' ? '<div class="more2"><label class="f">How to use it</label><textarea oninput="C().data.items[' + i + '].how=this.value;mark()">' + E(x.how) + '</textarea><label class="f">Hours a week it gives back (leave blank until you know)</label><input type="text" value="' + E(x.hrs) + '" oninput="C().data.items[' + i + '].hrs=this.value;mark()"><label class="f">Link to it (optional)</label><input type="text" value="' + E(x.link) + '" oninput="C().data.items[' + i + '].link=this.value;mark()"></div>'
        : (x.st !== 'Not started' ? '<label class="f">When it\'s done, or what it waits on</label><input type="text" value="' + E(x.when) + '" oninput="C().data.items[' + i + '].when=this.value;mark()">' : '')) +
      '<p class="hint"><a href="#" onclick="C().data.items.splice(' + i + ',1);mark();draw();return false">Remove this item</a></p></div>').join('') +
    '<p style="margin:10px 0 0"><button class="mini ghost" onclick="C().data.items.push({t:\'New item\',d:\'\',st:\'Not started\'});mark();draw()">+ Add An Item</button></p></div>';
  // 4. Ask him for something
  h += '<div class="ctrl"><h4>Ask Him For Something</h4><textarea id="need" placeholder="Example: the login for your Google Business Profile"></textarea><p class="small" style="margin:6px 0">It shows under "What We Need From You" on his page. Tell him it\'s there when you next talk or text.</p><button class="mini" onclick="addNeed()">Put It On His Page</button>' +
    d.need.map((n, i) => '<div class="row2"><span' + (n.done ? ' style="text-decoration:line-through;color:#888"' : '') + '>' + E(n.t) + '</span><label style="font-size:14px"><input type="checkbox"' + (n.done ? ' checked' : '') + ' onchange="C().data.need[' + i + '].done=this.checked;save()"> He did it</label></div>').join('') + '</div>';
  // 5. Notes
  h += '<div class="ctrl"><h4>Add A Note</h4><textarea id="note" placeholder="Anything worth keeping about this owner"></textarea><div class="who2"><label><input type="radio" name="nw" value="0" checked> Just us</label><label><input type="radio" name="nw" value="1"> Show him too</label></div><p class="small" style="margin:0 0 6px">A "Just us" note stays on the Team only tab. A note he can see shows on his page, under his next step.</p><button class="mini" onclick="addNote()">Save The Note</button></div>';
  // 6. The top of his page
  const sel = (d.roadL && d.roadL.length ? d.roadL : STAGES).map((s, i) => '<option value="' + i + '"' + (i == (+d.stage || 0) ? ' selected' : '') + '>' + E(s) + '</option>').join('');
  const fld = (lab, path, val, big) => '<label class="f">' + lab + '</label>' + (big ? '<textarea oninput="setP(\'' + path + '\',this.value)">' + E(val) + '</textarea>' : '<input type="text" value="' + E(val) + '" oninput="setP(\'' + path + '\',this.value)">');
  h += '<div class="ctrl"><h4>The Top Of His Page</h4>' + fld('Page title', 'biz', d.biz) + fld('Line above the title', 'who', d.who) +
    '<label class="f">Where he is on the road</label><select onchange="C().data.stage=+this.value;mark()">' + sel + '</select>' + fld('The steps of his road, one per line (blank = the usual four)', 'roadL', (d.roadL || []).join('\n'), 1) +
    fld('Next step: small label', 'next.k', d.next.k) + fld('Next step: headline', 'next.h', d.next.h) + fld('Next step: what to know', 'next.p', d.next.p, 1) + fld('Next step: when', 'next.when', d.next.when) + fld('Next step: button words', 'next.btn', d.next.btn) + fld('Next step: button link', 'next.link', d.next.link) + '</div>';
  // 7. The rest of his page
  h += '<div class="ctrl"><h4>The Rest Of His Page</h4>' +
    fld('Three numbers (one per line: label | number)', 'stats', d.stats.map(s => s.join(' | ')).join('\n'), 1) +
    fld('What he asked for, in his words (first stage)', 'asked', d.asked, 1) + fld('What-we-found video: button words', 'video.t', d.video.t) + fld('What-we-found video: link', 'video.link', d.video.link) + fld('The tools out there (first stage)', 'tools', d.tools, 1) +
    fld('The offer: headline', 'offer.h', d.offer.h) + fld('The offer: what he gets', 'offer.p', d.offer.p, 1) + fld('The offer: button words', 'offer.btn', d.offer.btn) + fld('The offer: button link (Stripe)', 'offer.link', d.offer.link) +
    fld('His plan: quick wins (one per line; start with ✓ if he picked it)', 'plan.q', d.plan.q.join('\n'), 1) + fld('His plan: big moves', 'plan.b', d.plan.b.join('\n'), 1) + fld('His plan: small fixes', 'plan.s', d.plan.s.join('\n'), 1) + fld('His plan: not now', 'plan.n', d.plan.n.join('\n'), 1) +
    fld('Our meetings (one per line: title | what happened | link)', 'meets', d.meets.map(m => [m.t, m.d, m.link || ''].join(' | ')).join('\n'), 1) +
    fld('More we can do (one per line: title | what it is | price | link)', 'more', d.more.map(m => [m.t, m.d, m.price || '', m.link || ''].join(' | ')).join('\n'), 1) +
    fld('His agreement', 'agree.text', d.agree.text, 1) + fld('His agreement: link', 'agree.link', d.agree.link) + '</div>';
  // 8. Who can sign in
  h += '<div class="ctrl"><h4>Who Can Open His Page</h4><label class="f" for="em">Their emails (commas between)</label><input type="email" id="em" value="' + E(c.emails) + '" oninput="C().emails=this.value;mark()"><p class="hint">They go to 2guysandagenie.com/c/, type that email, and get a code. Nobody gets a message from adding it here.</p></div>';
  return h;
}
function team(c) {
  const t = c.data.team = c.data.team || {}, f = (lab, k, big) => '<label class="f">' + lab + '</label>' + (big ? '<textarea oninput="C().data.team[\'' + k + '\']=this.value;mark()">' + E(t[k]) + '</textarea>' : '<input type="text" value="' + E(t[k]) + '" oninput="C().data.team[\'' + k + '\']=this.value;mark()">');
  const notes = (c.data.notes || []).filter(n => !n.show);
  return '<div class="ctrl"><h4>Team Only</h4>' + f('Paid so far', 'paid') + f('On the table', 'ontable') + f('Came from', 'source') + f('Who\'s on it', 'on') + f('Last touch', 'last') + f('Research and recordings (one per line)', 'links', 1) + '</div>' +
    '<div class="ctrl"><h4>Our Notes</h4>' + (notes.length ? notes.map(n => '<div class="it"><p style="margin:0">' + E(n.t) + '</p><p class="hint">' + E(n.by || '') + (n.ts ? ' · ' + new Date(n.ts).toLocaleDateString() : '') + '</p></div>').join('') : '<p class="small" style="margin:0">No notes yet.</p>') + '</div>';
}
function detail() {
  const c = C(); if (!c) { cur = ''; return list(); }
  let h = '<a class="back" href="#" onclick="go(\'\');return false">← All clients</a><h1 style="font-size:34px">' + E(c.name) + '</h1><p class="small">His page: <b>2guysandagenie.com/c/</b> (he signs in with ' + (c.emails ? E(c.emails) : 'an email you add below') + ') · <a href="/c/?c=' + E(c.slug) + '" target="_blank">open it as he sees it</a></p>';
  h += '<div class="tabs"><button class="' + (tab === 'edit' ? 'on' : '') + '" onclick="tabTo(\'edit\')">Update His Page</button><button class="' + (tab === 'see' ? 'on' : '') + '" onclick="tabTo(\'see\')">What He Sees</button><button class="' + (tab === 'team' ? 'on' : '') + '" onclick="tabTo(\'team\')">Team Only</button></div>';
  if (tab === 'see') { const d = JSON.parse(JSON.stringify(c.data)); delete d.team; delete d.inbox; d.notes = (d.notes || []).filter(n => n.show); d.items = (d.items || []).filter(i => i.st !== 'Not started'); h += '<p class="note">This is his page as it stands. Unsaved changes show here too.</p>' + drawClientPage(d, {}); }
  else h += tab === 'team' ? team(c) : editor(c);
  h += '<div class="bar"><button class="btn" onclick="save()">Save</button><span id="msg" class="msg">' + (dirty ? 'You have changes that are not saved.' : 'Last saved by ' + E(c.by === 'owner' ? 'him (a question)' : c.by || '') + ' on ' + new Date(c.upd).toLocaleString() + '.') + '</span></div>';
  return h;
}
function draw() { if (!D) return; V.innerHTML = cur ? detail() : list(); }
window.mark = () => { dirty = true; say('You have changes that are not saved.'); };
window.setSt = (i, v) => { C().data.items[i].st = v; mark(); draw(); };
window.setP = (path, v) => { const d = C().data, k = path.split('.');
  if (path === 'stats') d.stats = pipes(v).map(p => [p[0] || '', p[1] || '']);
  else if (path === 'roadL') d.roadL = lines(v);
  else if (path === 'meets') d.meets = pipes(v).map(p => ({ t: p[0] || '', d: p[1] || '', link: p[2] || '' }));
  else if (path === 'more') d.more = pipes(v).map(p => ({ t: p[0] || '', d: p[1] || '', price: p[2] || '', link: p[3] || '' }));
  else if (k[0] === 'plan') d.plan[k[1]] = lines(v);
  else if (k.length === 2) (d[k[0]] = d[k[0]] || {})[k[1]] = v; else d[k[0]] = v;
  mark(); };
window.postIn = i => { const d = C().data, u = d.inbox.splice(i, 1)[0]; d.meets.push({ t: u.t, d: u.d || '', link: u.link || '' }); save(); };
window.answer = i => { const a = $('ans' + i).value.trim(); if (!a) return; Object.assign(C().data.qa[i], { a, aby: me, ats: Date.now() }); save(); };
window.addNeed = () => { const t = $('need').value.trim(); if (!t) return; C().data.need.push({ t, by: me, ts: Date.now() }); save(); };
window.addNote = () => { const t = $('note').value.trim(); if (!t) return; const show = document.querySelector('input[name=nw]:checked').value === '1'; C().data.notes.push({ t, show, by: me, ts: Date.now() }); save(); };
window.C = C; window.save = save; window.draw = draw;
addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
load();
}
</script>
</body></html>
